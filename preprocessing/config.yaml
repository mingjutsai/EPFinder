# EPFinder preprocessing configuration template.
#
# Copy this file to a local path and replace every /path/to/... value with paths
# available on your analysis server. Coordinates and annotations must use hg38.

# Input GWAS/candidate SNP file.
# Required columns: chromosome in column 1 and SNP position in column 2.
input_gwas: "/path/to/candidate_snps.hg38.tsv"

# External tools.
bedtools_path: "bedtools"

# In-house osteoblast Hi-C contact matrix.
# Files are expected to be per-chromosome text files named:
#   {hic_prefix}chr1, {hic_prefix}chr2, ...
# Each line should contain: bin_start<TAB>bin_end<TAB>contact_value.
hic_folder: "/path/to/ob_day13_hic/3k"
hic_prefix: "OB13.bam.pre.filter.q30.3k.hic.KR."

# Genome annotation: sorted hg38 protein-coding transcript TSS BED-like file.
tss_file: "/path/to/gencode.v29.protein_coding.tss.sorted.tsv"

# Osteoblast expression matrices.
tx_expression: "/path/to/osteoblast_transcript_expression.tsv"
gene_list: "/path/to/gencode.v29.gene_symbol_to_ensg.tsv"
gene_expression: "/path/to/osteoblast_gene_expression.tsv"

# Ordered chromatin feature list.
feature_list: "feature_list"

# Feature-window parameters.
enhancer_window: 250
promoter_window: 250
hic_bin_size: 3000

# Output.
output_dir: "/path/to/epfinder_output"
output_file: "EPFinder_29features_ML.tsv"

# Parallelism for Hi-C contact extraction.
step1_nproc: 8
