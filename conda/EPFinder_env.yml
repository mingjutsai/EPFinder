# EPFinder runtime environment (recommended).
#
# Installs bedtools plus the pinned Python stack the release model was trained
# and validated with, without PyCaret's optional extras (dashboards, model
# explainers, cloud and NLP tooling), which EPFinder never imports.
#
# Create with:  conda env create -f conda/EPFinder_env.yml
#
# The binding constraint is scikit-learn 1.2.2, not Python. The model's ensemble
# contains GradientBoostingClassifier estimators pickled against
# sklearn.ensemble._gb_losses, a module removed in scikit-learn 1.3, so the
# model cannot be loaded on any later scikit-learn. Python 3.11 is the newest
# release that scikit-learn 1.2.2 and PyCaret 3.2.0 support.
#
# The model was saved under Python 3.8.18. Loading it here gives bit-identical
# scores on the GM12878 benchmark, the K562 training set and 275,516 eBMD
# enhancer-promoter pairs; PyCaret's version-mismatch warning at load time is
# expected. Going beyond Python 3.11 requires re-training the model.
#
# For the original Python 3.8 environment, use conda/EPFinder_env.lock.yml.
name: EPFinder_env
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - bedtools>=2.30
  - pip=24.3.1
  - pip:
      # Core stack, pinned to the versions the model pickle was built against.
      - numpy==1.24.4
      - pandas==1.5.3
      - pyyaml==6.0.3
      - scikit-learn==1.2.2
      - pycaret==3.2.0
      # PyCaret 3.2.0 imports joblib.memory._format_load_msg, removed in
      # joblib 1.4.0, but declares no upper bound of its own.
      - joblib==1.3.2
      # Estimators embedded in the release model's voting ensemble. Without
      # these, load_model() fails with ModuleNotFoundError.
      - xgboost==2.1.4
      - lightgbm==4.6.0
      # 1.1.1 was used at training time but ships no Python 3.11 wheel; 1.2.10
      # loads the same model and reproduces its scores exactly.
      - catboost==1.2.10
      # Only needed to run the notebooks.
      - ipykernel==6.29.5
