# EPFinder runtime environment (recommended).
#
# Installs bedtools plus the pinned Python stack the release model was trained
# and validated with, without PyCaret's optional extras (dashboards, model
# explainers, cloud and NLP tooling), which EPFinder never imports.
#
# Create with:  conda env create -f conda/EPFinder_env.yml
#
# Python 3.8 is pinned deliberately: finalize_EPFinder_model.pkl was serialized
# under Python 3.8.18 with scikit-learn 1.2.2 and PyCaret 3.2.0, and PyCaret
# warns on any mismatch at load time. The EPFinder source itself is not tied to
# 3.8. Moving to a supported Python requires re-exporting the model.
#
# For byte-level reproduction of the original environment, use
# conda/EPFinder_env.lock.yml instead.
name: EPFinder_env
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.8.20
  - bedtools>=2.30
  - pip=24.3.1
  - pip:
      # Core stack, pinned to the versions the model pickle was built against.
      - numpy==1.24.4
      - pandas==1.5.3
      - pyyaml==6.0.3
      - scikit-learn==1.2.2
      - pycaret==3.2.0
      # PyCaret 3.2.0 imports joblib.memory._format_load_msg, removed in
      # joblib 1.4.0, but declares no upper bound of its own.
      - joblib==1.3.2
      # Estimators embedded in the release model's voting ensemble. Without
      # these, load_model() fails with ModuleNotFoundError.
      - xgboost==2.1.4
      - lightgbm==4.6.0
      - catboost==1.1.1
      # Only needed to run the notebooks.
      - ipykernel==6.29.5
